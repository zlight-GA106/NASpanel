<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程控制 · Storage Station</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/app.css"><script defer src="/vendor/signalr.min.js"></script><script defer src="/vendor/echarts.min.js"></script><script type="module" src="/js/remote.js"></script></head><body data-page="remote"><div id="shell"></div><main class="main"><div class="breadcrumb"><a href="/">Storage Station</a> / 远程控制</div><div id="environment" class="notice warning hidden"></div>
<div class="page-head"><div><h1>远程控制</h1><p>通过 noVNC 安全访问 Windows Server 桌面</p></div><div class="head-actions"><span id="remote-status" class="badge unknown">未连接</span><button id="connect-remote" class="primary">连接桌面</button></div></div><div id="remote-notice" class="notice">正在检查本地 VNC 服务…</div><section class="card"><div class="card-head"><h2>Windows Server 桌面</h2><div class="toolbar"><button id="send-cad" class="small" disabled>发送 Ctrl+Alt+Del</button><button id="fullscreen" class="small">全屏</button><button id="disconnect" class="small" disabled>断开</button></div></div><div id="remote-screen" class="remote-screen"><div id="remote-placeholder" class="remote-placeholder"><div class="monitor-icon"></div><h2>远程桌面尚未连接</h2><p class="muted">点击「连接桌面」开始会话</p></div><div id="remote-stage" class="remote-stage hidden"></div></div></section><p class="metric-note">会话受控制台登录保护，登录过期时连接会自动关闭。请确保服务器已运行 VNC 和 websockify。</p>
<dialog id="credentials"><form id="credentials-form"><h2>VNC 身份验证</h2><p class="muted">输入远程桌面服务的连接凭据。</p><div id="vnc-username-field" class="field hidden"><label for="vnc-username">用户名</label><input id="vnc-username" autocomplete="off"></div><label for="vnc-password">密码</label><input id="vnc-password" type="password" autocomplete="off"><div class="toolbar"><button id="cancel-credentials" type="button">取消</button><button class="primary">连接</button></div></form></dialog>
<footer class="footer"><span>Storage Station · 本地服务器控制台</span><span id="updated">等待采样</span></footer></main><div id="toast" role="status" aria-live="polite" hidden></div></body></html>
