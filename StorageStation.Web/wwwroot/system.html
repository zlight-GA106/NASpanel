<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统 · Storage Station</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/app.css"><script defer src="/vendor/signalr.min.js"></script><script defer src="/vendor/echarts.min.js"></script><script type="module" src="/js/system.js"></script></head><body data-page="system"><div id="shell"></div><main class="main"><div class="breadcrumb"><a href="/">Storage Station</a> / 系统</div><div id="environment" class="notice warning hidden"></div>
<div class="page-head"><div><h1>系统状态</h1><p>CPU、内存、温度与风扇的历史趋势</p></div><div class="head-actions"><label for="range">时间范围</label><select id="range" class="range"><option value="1">1 小时</option><option value="6">6 小时</option><option value="24">24 小时</option><option value="168">7 天</option><option value="720">30 天</option></select></div></div>
<div class="two-col equal-col"><section class="card"><div class="card-head"><h2>CPU 使用率</h2><span id="current-cpu">--</span></div><div class="card-body"><div id="cpu-chart" class="chart"></div></div></section><section class="card"><div class="card-head"><h2>CPU 温度</h2><span id="current-temp">--</span></div><div class="card-body"><div id="temp-chart" class="chart"></div></div></section><section class="card"><div class="card-head"><h2>内存使用率</h2><span id="current-memory">--</span></div><div class="card-body"><div id="memory-chart" class="chart"></div></div></section><section class="card"><div class="card-head"><h2>机箱风扇转速</h2><span id="current-rpm">--</span></div><div class="card-body"><div id="rpm-chart" class="chart"></div></div></section></div>
<section class="card"><div class="card-head"><h2>已发现的硬件传感器</h2><button id="refresh-sensors" class="small">刷新列表</button></div><div class="table-wrap"><table><thead><tr><th>硬件</th><th>名称</th><th>类型</th><th>当前值</th><th>Identifier</th><th>可写</th></tr></thead><tbody id="sensor-table"></tbody></table></div></section>
<footer class="footer"><span>Storage Station · 本地服务器控制台</span><span id="updated">等待采样</span></footer></main><div id="toast" role="status" aria-live="polite" hidden></div></body></html>
