<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风扇 · Storage Station</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/app.css"><script defer src="/vendor/signalr.min.js"></script><script defer src="/vendor/echarts.min.js"></script><script type="module" src="/js/fan.js"></script></head><body data-page="fans"><div id="shell"></div><main class="main"><div class="breadcrumb"><a href="/">Storage Station</a> / 风扇</div><div id="environment" class="notice warning hidden"></div>
<div class="page-head"><div><h1>风扇控制</h1><p>按温度平稳调速，安全规则始终优先</p></div><span id="fan-health"></span></div><div id="fan-notice" class="notice hidden"></div>
<div class="two-col equal-col"><section class="card"><div class="card-head"><h2>机箱风扇</h2><span id="fan-mode-label" class="muted"></span></div><div class="card-body"><div class="fan-live"><div><div class="eyebrow">实际转速</div><div class="metric-value"><span id="fan-rpm">--</span><small>RPM</small></div></div><div><div class="eyebrow">当前输出</div><div class="metric-value"><span id="fan-pwm">--</span><small>%</small></div></div><div><div class="eyebrow">目标输出</div><div class="metric-value"><span id="fan-target">--</span><small>%</small></div></div></div><div class="mode-buttons"><button id="mode-auto">自动曲线</button><button id="mode-manual">手动</button><button id="mode-bios">BIOS 默认</button></div><div id="manual-panel" class="hidden"><label for="manual-percent">手动输出</label><input id="manual-percent" type="range" min="30" max="100" value="65"><div class="manual-value"><span id="manual-display">65</span><small> %</small></div><div class="toolbar"><label for="manual-minutes">持续时间</label><select id="manual-minutes"><option value="10">10 分钟</option><option value="30" selected>30 分钟</option><option value="60">60 分钟</option></select><button id="manual-apply" class="primary">应用</button></div></div><p id="manual-remaining" class="metric-note"></p><p id="control-temperature" class="metric-note"></p></div></section>
<section class="card"><div class="card-head"><h2>安全保护</h2><span class="badge healthy">始终生效</span></div><div class="card-body fan-safety" id="fan-safety"></div></section></div>
<section class="card"><div class="card-head"><h2>自动温控曲线</h2><div class="toolbar"><label for="temperature-source">温度来源</label><select id="temperature-source"><option value="disk">最高硬盘温度</option><option value="cpu">CPU 温度</option><option value="max">MAX(CPU, 硬盘)</option></select></div></div><div class="two-col equal-col card-body"><div><div class="chart" id="curve-chart"></div><p class="metric-note">蓝线：配置曲线 · 橙点：当前温度与目标输出</p></div><div><table class="curve-table"><thead><tr><th>温度 (°C)</th><th>PWM (%)</th><th></th></tr></thead><tbody id="curve-points"></tbody></table><div class="curve-tools"><button id="add-point" class="small">添加温度点</button><button id="save-curve" class="primary">保存曲线</button></div></div></div></section>
<footer class="footer"><span>Storage Station · 本地服务器控制台</span><span id="updated">等待采样</span></footer></main><div id="toast" role="status" aria-live="polite" hidden></div></body></html>
